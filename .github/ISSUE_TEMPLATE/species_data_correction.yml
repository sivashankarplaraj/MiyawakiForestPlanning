name: Species data correction
description: Request a correction to plant/ecology data
labels: ["area:data", "needs-ecology-review"]
body:
  - type: input
    id: species
    attributes:
      label: Species scientific name
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region or geography
    validations:
      required: true
  - type: textarea
    id: field
    attributes:
      label: Field(s) to correct
      description: Example: nativity status, soil fit, canopy layer
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current value and issue
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed value
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and sources
      description: Add links and notes
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: Confidence level
      options:
        - High
        - Medium
        - Low
