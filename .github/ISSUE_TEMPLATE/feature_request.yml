name: Feature request
description: Propose an enhancement
labels: ["type:feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI
        - Data
        - Simulation
        - Export
        - Docs
        - DevEx
  - type: textarea
    id: acceptance
    attributes:
      label: Suggested acceptance criteria
